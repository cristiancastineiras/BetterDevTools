name: CI

# Validates changes. It never publishes anything: a release is made only by pushing a version tag
# (see release.yml and docs/releasing.md).
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # corepack provides the pnpm version pinned in package.json ("packageManager")
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Chrome, Edge and Firefox
        run: pnpm build:all

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/extension

      # Chromium panel suites + real-DevTools capture; the Edge and Firefox projects run against
      # the browsers preinstalled on the runner image
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload builds
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-builds
          path: apps/extension/.output/*-mv3
          if-no-files-found: ignore
          retention-days: 7
