name: Release

# Publishes a version: push an annotated stable tag (vMAJOR.MINOR.PATCH) and this workflow validates it,
# builds the Chrome, Edge and Firefox packages from that exact commit, and attaches them to a GitHub
# Release. Nothing else (pushes, pull requests, prerelease tags) creates a release.
# Procedure and rollback: docs/releasing.md
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag format and commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          # a release comes from main: the tagged commit must be part of its history
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main; releases are made from main only." >&2
            exit 1
          fi
          # annotated tags only (a lightweight tag points straight at the commit); fetch the tag
          # object itself, since a shallow checkout may have replaced it with a plain reference
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Tag $GITHUB_REF_NAME is lightweight; create release tags with git tag -a." >&2
            exit 1
          fi

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # the version lives in apps/extension/package.json; the tag must agree and CHANGELOG.md must describe it
      - name: Check version and changelog against the tag
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build and zip Chrome, Edge and Firefox
        run: pnpm zip:all

      - name: Check the packages and write checksums and release notes
        run: node scripts/release.mjs package "$GITHUB_REF_NAME"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # write access only here, to create the release
    permissions:
      contents: write
    steps:
      - name: Download the files built from this tag
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            dist/*.zip dist/SHA256SUMS.txt
